<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!-- seta aberta das dependencias «include» / «extend» -->
    <marker id="seta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#1c1e24" stroke-width="1.4" />
    </marker>
    <!-- triangulo vazado da generalizacao de atores -->
    <marker id="generalizacao" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#ffffff" stroke="#1c1e24" stroke-width="1.4" />
    </marker>
  </defs>

  <style>
    .uc      { fill:#ece8ff; stroke:#7C5CFF; stroke-width:1.8 }
    .uc-txt  { font-size:12.5px; fill:#1c1e24; text-anchor:middle }
    .ator    { fill:none; stroke:#1c1e24; stroke-width:1.8; stroke-linecap:round }
    .ator-lbl{ font-size:12.5px; fill:#1c1e24; text-anchor:middle; font-weight:600 }
    .assoc   { stroke:#1c1e24; stroke-width:1.3; fill:none }
    .dep     { stroke:#1c1e24; stroke-width:1.3; fill:none; stroke-dasharray:6 4 }
    .estereo { font-size:11px; fill:#4b5160; text-anchor:middle; font-style:italic }
    .limite  { fill:none; stroke:#1c1e24; stroke-width:1.6 }
    .limite-lbl { font-size:13px; fill:#1c1e24; text-anchor:middle; font-weight:600 }
  </style>

  <rect x="0" y="0" width="1160" height="700" fill="#ffffff" />

  <!-- ============ fronteira do sistema ============ -->
  <rect class="limite" x="415" y="40" width="515" height="620" />
  <text class="limite-lbl" x="672" y="68">Portfólio — Perfis de Acesso</text>

  <!-- ============ atores ============ -->
  <!-- Recrutador / Empresa -->
  <g>
    <circle class="ator" cx="75" cy="120" r="11" />
    <line class="ator" x1="75" y1="131" x2="75" y2="165" />
    <line class="ator" x1="57" y1="144" x2="93" y2="144" />
    <line class="ator" x1="75" y1="165" x2="61" y2="188" />
    <line class="ator" x1="75" y1="165" x2="89" y2="188" />
    <text class="ator-lbl" x="75" y="208">Recrutador /</text>
    <text class="ator-lbl" x="75" y="224">Empresa</text>
  </g>
  <!-- Professor / Avaliador -->
  <g>
    <circle class="ator" cx="75" cy="320" r="11" />
    <line class="ator" x1="75" y1="331" x2="75" y2="365" />
    <line class="ator" x1="57" y1="344" x2="93" y2="344" />
    <line class="ator" x1="75" y1="365" x2="61" y2="388" />
    <line class="ator" x1="75" y1="365" x2="89" y2="388" />
    <text class="ator-lbl" x="75" y="408">Professor /</text>
    <text class="ator-lbl" x="75" y="424">Avaliador</text>
  </g>
  <!-- Desenvolvedor / Comunidade -->
  <g>
    <circle class="ator" cx="75" cy="510" r="11" />
    <line class="ator" x1="75" y1="521" x2="75" y2="555" />
    <line class="ator" x1="57" y1="534" x2="93" y2="534" />
    <line class="ator" x1="75" y1="555" x2="61" y2="578" />
    <line class="ator" x1="75" y1="555" x2="89" y2="578" />
    <text class="ator-lbl" x="75" y="598">Desenvolvedor /</text>
    <text class="ator-lbl" x="75" y="614">Comunidade</text>
  </g>
  <!-- Visitante (ator primario) -->
  <g>
    <circle class="ator" cx="250" cy="310" r="12" />
    <line class="ator" x1="250" y1="322" x2="250" y2="358" />
    <line class="ator" x1="231" y1="336" x2="269" y2="336" />
    <line class="ator" x1="250" y1="358" x2="235" y2="382" />
    <line class="ator" x1="250" y1="358" x2="265" y2="382" />
    <text class="ator-lbl" x="250" y="402">Visitante</text>
  </g>
  <!-- Proprietario -->
  <g>
    <circle class="ator" cx="1035" cy="560" r="11" />
    <line class="ator" x1="1035" y1="571" x2="1035" y2="605" />
    <line class="ator" x1="1017" y1="584" x2="1053" y2="584" />
    <line class="ator" x1="1035" y1="605" x2="1021" y2="628" />
    <line class="ator" x1="1035" y1="605" x2="1049" y2="628" />
    <text class="ator-lbl" x="1035" y="648">Proprietário</text>
    <text class="ator-lbl" x="1035" y="664">(Vinícius)</text>
  </g>

  <!-- ============ generalizacoes: cada perfil "e um" Visitante ============ -->
  <line class="assoc" x1="103" y1="150" x2="223" y2="292" marker-end="url(#generalizacao)" />
  <line class="assoc" x1="103" y1="342" x2="216" y2="338" marker-end="url(#generalizacao)" />
  <line class="assoc" x1="103" y1="532" x2="223" y2="372" marker-end="url(#generalizacao)" />

  <!-- ============ casos de uso ============ -->
  <!-- UC03 Trocar perfil -->
  <ellipse class="uc" cx="545" cy="110" rx="92" ry="40" />
  <text class="uc-txt" x="545" y="115">UC03 Trocar perfil</text>

  <!-- UC01 Selecionar perfil de acesso -->
  <ellipse class="uc" cx="545" cy="250" rx="92" ry="40" />
  <text class="uc-txt" x="545" y="246">UC01 Selecionar perfil</text>
  <text class="uc-txt" x="545" y="263">de acesso</text>

  <!-- UC04 Visualizar portfolio com destaques -->
  <ellipse class="uc" cx="545" cy="390" rx="92" ry="40" />
  <text class="uc-txt" x="545" y="386">UC04 Visualizar portfólio</text>
  <text class="uc-txt" x="545" y="403">com destaques</text>

  <!-- UC05 Acessar por link com perfil pre-definido -->
  <ellipse class="uc" cx="545" cy="530" rx="92" ry="40" />
  <text class="uc-txt" x="545" y="526">UC05 Acessar por link</text>
  <text class="uc-txt" x="545" y="543">com perfil pré-definido</text>

  <!-- UC02 Pular selecao -->
  <ellipse class="uc" cx="810" cy="250" rx="92" ry="40" />
  <text class="uc-txt" x="810" y="255">UC02 Pular seleção</text>

  <!-- UC06 Configurar destaques -->
  <ellipse class="uc" cx="810" cy="580" rx="92" ry="40" />
  <text class="uc-txt" x="810" y="576">UC06 Configurar destaques</text>
  <text class="uc-txt" x="810" y="593">de um perfil</text>

  <!-- ============ associacoes ator - caso de uso ============ -->
  <line class="assoc" x1="277" y1="298" x2="455" y2="128" />
  <line class="assoc" x1="281" y1="318" x2="453" y2="248" />
  <line class="assoc" x1="281" y1="345" x2="453" y2="382" />
  <line class="assoc" x1="277" y1="360" x2="455" y2="518" />
  <line class="assoc" x1="1009" y1="580" x2="902" y2="580" />

  <!-- ============ dependencias ============ -->
  <!-- UC03 «include» UC01: trocar de perfil sempre passa pela selecao -->
  <line class="dep" x1="545" y1="150" x2="545" y2="208" marker-end="url(#seta)" />
  <text class="estereo" x="597" y="184">«include»</text>

  <!-- UC02 «extend» UC01: pular e o comportamento opcional da selecao -->
  <line class="dep" x1="716" y1="250" x2="641" y2="250" marker-end="url(#seta)" />
  <text class="estereo" x="678" y="240">«extend»</text>
</svg>
